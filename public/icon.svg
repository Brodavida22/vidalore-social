  <!-- Obsidian squircle container -->
  <rect x="16" y="16" width="480" height="480" rx="114" fill="url(#bgGrad)" />
  <rect x="17" y="17" width="478" height="478" rx="113" stroke="url(#rimHighlight)" stroke-width="2" />

  <!-- Soft crimson ambient glow -->
  <circle cx="256" cy="248" r="190" fill="url(#auraGrad)" />

  <!-- Left V-Petal Wing -->
  <path
    d="M 102 156 C 146 156 178 178 198 218 L 256 332 L 256 406 C 188 364 118 262 102 156 Z"
