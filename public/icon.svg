  />

  <!-- Right V-Petal Wing -->
  <path
    d="M 410 156 C 366 156 334 178 314 218 L 256 332 L 256 406 C 324 364 394 262 410 156 Z"
    fill="url(#rightPetalGrad)"
  />

  <!-- Crisp inner bevel highlight on left wing -->
  <path
    d="M 106 160 C 146 161 175 182 196 218 L 256 332 L 256 346 L 190 221 C 170 185 142 167 106 160 Z"
    fill="#FFFFFF"
    fill-opacity="0.18"
  />

  <!-- Central Sculpted Rose Bud Crest -->
  <path
    d="M 256 106 C 296 144 314 190 290 240 C 279 263 267 276 256 285 C 245 276 233 263 222 240 C 198 190 216 144 256 106 Z"
    fill="url(#budBaseGrad)"
  />
  <path
    d="M 256 106 C 232 148 232 198 256 285 C 245 276 233 263 222 240 C 198 190 216 144 256 106 Z"
