      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>
    <linearGradient id="rightPetalGrad" x1="410" y1="156" x2="256" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F02E74" />
      <stop offset="52%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <linearGradient id="budBaseGrad" x1="256" y1="106" x2="256" y2="285" gradientUnits="userSpaceOnUse">
