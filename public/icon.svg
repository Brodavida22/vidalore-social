      <stop offset="55%" stop-color="#0C0C10" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="256" cy="248" r="190" gradientUnits="userSpaceOnUse">
